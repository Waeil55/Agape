<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" rx="60" fill="#1E3A8A"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B5BB3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="128" cy="128" r="100" fill="url(#grad1)"/>

  <!-- Truck icon -->
  <g transform="translate(128, 128)">
    <!-- Truck body -->
    <rect x="-45" y="-20" width="70" height="30" rx="4" fill="white" opacity="0.95"/>

    <!-- Truck cabin -->
    <rect x="25" y="-25" width="20" height="25" rx="3" fill="white" opacity="0.95"/>

    <!-- Window -->
    <rect x="28" y="-20" width="14" height="12" rx="2" fill="#1E3A8A" opacity="0.3"/>

    <!-- Front wheels -->
    <circle cx="12" cy="20" r="8" fill="white" opacity="0.9"/>
    <circle cx="12" cy="20" r="5" fill="#1E3A8A"/>

    <!-- Back wheels -->
    <circle cx="-30" cy="20" r="8" fill="white" opacity="0.9"/>
    <circle cx="-30" cy="20" r="5" fill="#1E3A8A"/>

    <!-- Cargo area shading -->
    <rect x="-40" y="-15" width="60" height="5" fill="white" opacity="0.4"/>
  </g>

  <!-- Company text (subtle) -->
  <text x="128" y="220" font-size="14" font-weight="bold" fill="white" text-anchor="middle" opacity="0.8">AGAPE CARE</text>
</svg>
