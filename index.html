<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Agape Care NEMT Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input,select,textarea,button{font-family:inherit;font-size:16px;outline:none}
    html,body{font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(1rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left))}
    .modal-backdrop.open{opacity:1;pointer-events:auto}
    .modal-panel{transform:scale(.95);transition:transform .2s cubic-bezier(.16,1,.3,1);max-height:96vh;display:flex;flex-direction:column}
    .modal-backdrop.open .modal-panel{transform:scale(1)}
    .modal-body{overflow-y:auto}
    .toast-container{position:fixed;bottom:max(2rem,env(safe-area-inset-bottom));right:2rem;display:flex;flex-direction:column;gap:.5rem;z-index:200}
    @media(max-width:600px){.toast-container{left:1rem;right:1rem;bottom:max(1rem,env(safe-area-inset-bottom))}}
    .toast{padding:1rem 1.25rem;border-radius:.5rem;background:#1e293b;color:#fff;box-shadow:0 10px 15px -3px rgba(0,0,0,.1);border-left:4px solid #3b82f6;display:flex;align-items:center;gap:.75rem;transform:translateX(120%);transition:transform .3s cubic-bezier(.16,1,.3,1)}
    .toast.show{transform:translateX(0)}
    .toast.success{border-left-color:#10b981}
    .toast.danger{border-left-color:#ef4444}
    .toast.warning{border-left-color:#f59e0b}
    #loading-screen{position:fixed;inset:0;background:#f8fafc;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .spinner{width:48px;height:48px;border:4px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media print{.no-print,header,.tabs-bar{display:none!important}}
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

<!-- Loading Screen -->
<div id="loading-screen">
  <div class="spinner"></div>
  <h2 class="font-bold text-2xl text-slate-800">Agape Care NEMT</h2>
  <p class="text-slate-500 mt-2" id="loading-msg">Starting up...</p>
</div>

<!-- Auth Screen (hidden until ready) -->
<div id="auth-screen" style="display:none" class="min-h-screen bg-slate-100 flex flex-col items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <div class="flex justify-center mb-6 text-blue-600"><i class="ph-fill ph-ambulance text-5xl"></i></div>
    <h1 class="text-2xl font-bold text-center text-slate-800 mb-8">NEMT Manager Pro</h1>
    <div class="space-y-6">
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <h2 class="font-semibold text-slate-700 mb-4 flex items-center gap-2"><i class="ph ph-map-pin"></i> Driver Login</h2>
        <select id="auth-driver-select" class="w-full p-3 border rounded-lg mb-3 bg-white"></select>
        <input type="password" id="auth-driver-pin" placeholder="Driver PIN" class="w-full p-3 border rounded-lg mb-3" onkeydown="if(event.key==='Enter')APP.loginDriver()">
        <button onclick="APP.loginDriver()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">Login as Driver</button>
      </div>
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <h2 class="font-semibold text-slate-700 mb-4 flex items-center gap-2"><i class="ph ph-gear"></i> Admin Portal</h2>
        <input type="password" id="auth-admin-pin" placeholder="Admin PIN (default: 1234)" class="w-full p-3 border rounded-lg mb-3" onkeydown="if(event.key==='Enter')APP.loginAdmin()">
        <button onclick="APP.loginAdmin()" class="w-full py-3 bg-slate-800 text-white font-bold rounded-lg hover:bg-slate-900 transition">Access Admin Panel</button>
      </div>
    </div>
  </div>
</div>

<!-- Main App -->
<div id="app-main" style="display:none" class="min-h-screen bg-slate-50 pb-20">
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 w-full" style="padding-top:max(1rem,env(safe-area-inset-top))">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="ph-fill ph-ambulance text-2xl"></i>
        <h1 class="font-bold text-lg" id="header-title">Admin Dashboard</h1>
      </div>
      <div class="flex items-center gap-2">
        <span id="db-badge" class="hidden text-xs bg-white/20 px-2 py-1 rounded-full">🔥 Cloud</span>
        <button onclick="APP.logout()" class="flex items-center gap-1 bg-white/20 px-3 py-1.5 rounded-full hover:bg-white/30 text-sm font-medium transition"><i class="ph ph-sign-out"></i> Logout</button>
      </div>
    </div>
  </header>
  <div id="driver-status-bar" style="display:none" class="bg-white shadow-sm border-b px-4 py-3 sticky z-10 flex justify-between items-center max-w-4xl mx-auto">
    <div><span class="text-sm font-bold text-slate-700 block">GPS Tracking</span><span class="text-xs text-green-600">Transmitting Live Location...</span></div>
    <button class="px-4 py-2 rounded-full font-bold text-sm bg-green-600 text-white hover:bg-green-700 transition">GO ONLINE</button>
  </div>
  <main class="max-w-4xl mx-auto p-4 mt-4">
    <div class="flex space-x-2 mb-6 bg-white p-1 rounded-xl shadow-sm overflow-x-auto tabs-bar" id="tabs-container"></div>
    <div id="views-container"></div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>

<!-- Modal: Wizard -->
<div class="modal-backdrop" id="modal-wizard-prompt">
  <div class="modal-panel bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
    <div class="flex justify-between items-center p-4 border-b">
      <h2 class="text-xl font-bold text-slate-800" id="wizard-prompt-title">Arrived</h2>
      <button onclick="APP.closeModal('modal-wizard-prompt')" class="p-2 hover:bg-slate-100 rounded-full text-slate-500"><i class="ph ph-x"></i></button>
    </div>
    <div class="modal-body p-6">

      <div class="mb-4"><label class="block text-xs font-medium text-slate-500 mb-1">Odometer</label><input type="number" id="wizard-odo" class="w-full border p-2.5 rounded-lg" placeholder="e.g. 154200"></div>
      <div class="mb-4"><label class="block text-xs font-medium text-slate-500 mb-1">Actual Time</label><input type="time" id="wizard-time" class="w-full border p-2.5 rounded-lg"></div>
      <div class="hidden mb-4 p-3 bg-amber-50 border border-amber-200 rounded-lg flex gap-3 items-start" id="wizard-sig-wrap">

      <button onclick="APP.closeModal('modal-trip-form')" class="p-2 hover:bg-slate-100 rounded-full text-slate-500"><i class="ph ph-x"></i></button>
    </div>

          <div><label class="block text-xs font-medium text-slate-500 mb-1">Status</label>

<!-- Modal: Driver Form -->
<div class="modal-backdrop" id="modal-driver-form" onclick="if(event.target===this)APP.closeModal('modal-driver-form')">
  <div class="modal-panel bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
    <div class="flex justify-between items-center p-4 border-b">
      <h2 class="text-xl font-bold text-slate-800"><i class="ph ph-user"></i> Driver Details</h2>
      <button onclick="APP.closeModal('modal-driver-form')" class="p-2 hover:bg-slate-100 rounded-full text-slate-500"><i class="ph ph-x"></i></button>
    </div>
    <div class="modal-body p-6 space-y-4">
      <input type="hidden" id="driver-id">
      <div><label class="block text-xs font-medium text-slate-500 mb-1">Full Name</label><input type="text" id="driver-name" class="w-full border p-2.5 rounded-lg"></div>
      <div><label class="block text-xs font-medium text-slate-500 mb-1">Phone</label><input type="tel" id="driver-phone" class="w-full border p-2.5 rounded-lg"></div>

    <div class="p-4 border-t flex justify-end gap-3 bg-slate-50">
      <button class="px-4 py-2 font-medium text-slate-600 hover:bg-slate-200 rounded-lg" onclick="APP.closeModal('modal-driver-form')">Cancel</button>
      <button class="px-4 py-2 font-bold text-white bg-slate-800 hover:bg-slate-900 rounded-lg" onclick="APP.saveDriver()">Save Driver</button>
    </div>

<!-- CDN scripts at bottom so they don't block rendering -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════════════
// BOOT: Hide loading screen ASAP — within 300ms regardless of anything
// ═══════════════════════════════════════════════════════════════════════
var BOOT_DONE = false;
function showAuth() {
  if (BOOT_DONE) return;
  BOOT_DONE = true;
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = '';
  if (window.APP && APP.populateAuthSelect) APP.populateAuthSelect();
}
// Hard deadline: show auth screen after 1.5s NO MATTER WHAT
var BOOT_TIMER = setTimeout(showAuth, 1500);

// ═══════════════════════════════════════════════════════════════════════
// INDEXEDDB — permanent local database (gigabytes, survives restarts)
// ═══════════════════════════════════════════════════════════════════════
var IDB = {
  db: null,
  open: function(cb) {
    try {
      var req = indexedDB.open('AgapeNEMT', 2);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('trips'))    db.createObjectStore('trips',    {keyPath:'id'});
        if (!db.objectStoreNames.contains('drivers'))  db.createObjectStore('drivers',  {keyPath:'id'});
        if (!db.objectStoreNames.contains('kv'))       db.createObjectStore('kv',        {keyPath:'k'});
      };
      req.onsuccess = function(e) { IDB.db = e.target.result; cb(null); };
      req.onerror   = function(e) { cb(e); };
    } catch(e) { cb(e); }
  },
  getAll: function(store, cb) {
    if (!IDB.db) return cb([]);
    try {
      var req = IDB.db.transaction(store,'readonly').objectStore(store).getAll();
      req.onsuccess = function() { cb(req.result || []); };
      req.onerror   = function() { cb([]); };
    } catch(e) { cb([]); }
  },
  put: function(store, obj, cb) {
    cb = cb || function(){};
    if (!IDB.db) return cb();
    try {
      var req = IDB.db.transaction(store,'readwrite').objectStore(store).put(obj);
      req.onsuccess = cb;
      req.onerror   = cb;
    } catch(e) { cb(); }
  },
  del: function(store, id, cb) {
    cb = cb || function(){};
    if (!IDB.db) return cb();
    try {
      var req = IDB.db.transaction(store,'readwrite').objectStore(store).delete(id);
      req.onsuccess = cb;
      req.onerror   = cb;
    } catch(e) { cb(); }
  },
  getKV: function(k, def, cb) {
    if (!IDB.db) return cb(def);
    try {
      var req = IDB.db.transaction('kv','readonly').objectStore('kv').get(k);
      req.onsuccess = function() { cb(req.result ? req.result.v : def); };
      req.onerror   = function() { cb(def); };
    } catch(e) { cb(def); }
  },
  putKV: function(k, v, cb) {
    IDB.put('kv', {k:k, v:v}, cb);
  }
};

// ═══════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════
var STATE = {
  user:     null,
  trips:    [],
  drivers:  [{id:'d1', name:'John Doe', pin:'1111', phone:'555-0101', status:'active'}],
  settings: {workerUrl:'', apiKey:'', aiModel:'gpt-4o-mini', adminPin:'1234', mapApp:'google', firebaseConfig:''},
  view:     'dashboard',
  extracted:[],
  mapInst:  null,
  wizCb:    null,
  fbDb:     null,
  fbUnsubs: []
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ═══════════════════════════════════════════════════════════════════════
// DB LAYER — writes to IDB always, Firebase if connected
// ═══════════════════════════════════════════════════════════════════════
var DB = {
  saveTrip: function(trip, cb) {
    cb = cb || function(){};
    IDB.put('trips', trip, function() {
      var idx = STATE.trips.findIndex(function(t){return t.id===trip.id;});
      if (idx>-1) STATE.trips[idx]=trip; else STATE.trips.push(trip);
      if (STATE.fbDb) {
        var d = Object.assign({},trip); var id=d.id; delete d.id;
        STATE.fbDb.collection('nemt_trips').doc(id).set(d).catch(function(e){console.warn('FB trip:',e);});
      }
      cb();
    });
  },
  deleteTrip: function(id, cb) {
    cb = cb || function(){};
    IDB.del('trips', id, function() {
      STATE.trips = STATE.trips.filter(function(t){return t.id!==id;});
      if (STATE.fbDb) STATE.fbDb.collection('nemt_trips').doc(id).delete().catch(function(){});
      cb();
    });
  },
  saveDriver: function(driver, cb) {
    cb = cb || function(){};
    IDB.put('drivers', driver, function() {
      var idx = STATE.drivers.findIndex(function(d){return d.id===driver.id;});
      if (idx>-1) STATE.drivers[idx]=driver; else STATE.drivers.push(driver);
      if (STATE.fbDb) {
        var d = Object.assign({},driver); var id=d.id; delete d.id;
        STATE.fbDb.collection('nemt_drivers').doc(id).set(d).catch(function(){});
      }
      cb();
    });
  },
  saveSettings: function(s, cb) {
    IDB.putKV('settings', s, cb || function(){});
    if (STATE.fbDb) STATE.fbDb.collection('nemt_config').doc('settings').set(s).catch(function(){});
  }
};

// ═══════════════════════════════════════════════════════════════════════
// FIREBASE — optional cloud sync, loaded only when user configures it
// ═══════════════════════════════════════════════════════════════════════
function initFirebase(configJson) {
  if (!configJson || !configJson.trim()) return;
  // Load Firebase compat scripts dynamically — never blocks startup
  function loadScript(src, cb) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = function() { console.warn('Firebase script failed:', src); };
    document.head.appendChild(s);
  }
  loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js', function() {
    loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js', function() {
      try {
        var config = JSON.parse(configJson);
        var app = firebase.initializeApp(config);
        STATE.fbDb = firebase.firestore(app);
        // Sync listeners
        STATE.fbUnsubs.forEach(function(u){try{u();}catch(e){}});
        STATE.fbUnsubs = [];
        STATE.fbUnsubs.push(STATE.fbDb.collection('nemt_trips').onSnapshot(function(snap) {
          STATE.trips = [];
          snap.forEach(function(d){STATE.trips.push(Object.assign({id:d.id},d.data()));});
          APP.refreshView();
        }, function(e){console.warn('FB trips listener:',e);}));
        STATE.fbUnsubs.push(STATE.fbDb.collection('nemt_drivers').onSnapshot(function(snap) {
          STATE.drivers = [];
          snap.forEach(function(d){STATE.drivers.push(Object.assign({id:d.id},d.data()));});
          if (STATE.view==='drivers') APP.refreshView();
        }, function(e){console.warn('FB drivers listener:',e);}));
        document.getElementById('db-badge').classList.remove('hidden');
        APP.toast('🔥 Firebase connected — cloud sync active','success');
      } catch(e) {
        console.warn('Firebase init error:',e);
        APP.toast('Firebase config invalid. Using local database only.','warning');
      }
    });
  });
}

// ═══════════════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════════════
var APP = {

  // ── INIT (no async/await — pure callbacks for maximum compatibility) ──
  init: function() {
    document.getElementById('loading-msg').textContent = 'Opening local database...';
    IDB.open(function(err) {
      if (err) {
        console.warn('IDB failed, running in memory mode:', err);
        APP.afterLoad();
        return;
      }
      document.getElementById('loading-msg').textContent = 'Loading your data...';
      IDB.getAll('trips', function(trips) {
        if (trips.length) STATE.trips = trips;
        IDB.getAll('drivers', function(drivers) {
          if (drivers.length) STATE.drivers = drivers;
          else IDB.put('drivers', STATE.drivers[0]); // persist default driver
          IDB.getKV('settings', null, function(saved) {
            if (saved) STATE.settings = Object.assign(STATE.settings, saved);
            APP.afterLoad();
          });
        });
      });
    });
  },

  afterLoad: function() {
    clearTimeout(BOOT_TIMER);
    showAuth(); // hides loading, shows auth
    if (STATE.settings.firebaseConfig && STATE.settings.firebaseConfig.trim()) {
      initFirebase(STATE.settings.firebaseConfig);
    }
  },

  populateAuthSelect: function() {
    var sel = document.getElementById('auth-driver-select');
    if (!sel) return;
    sel.innerHTML = '<option value="">Select your profile...</option>' +
      STATE.drivers.filter(function(d){return d.status==='active';})
        .map(function(d){return '<option value="'+d.id+'">'+d.name+'</option>';}).join('');
  },

  loginAdmin: function() {
    var pin = document.getElementById('auth-admin-pin').value;
    if (pin === (STATE.settings.adminPin||'1234')) {
      STATE.user = {role:'admin', id:'admin', name:'Administrator'};
      APP.enterApp();
    } else APP.toast('Invalid Admin PIN','danger');
  },

  loginDriver: function() {
    var sel = document.getElementById('auth-driver-select').value;
    var pin = document.getElementById('auth-driver-pin').value;
    if (!sel) return APP.toast('Select a driver profile','warning');
    var driver = STATE.drivers.find(function(d){return d.id===sel;});

  vDashboard: function() {

    var comp = tt.filter(function(t){return t.status==='Completed';}).length;

    function card(label,val,cls) {

      var cls = t.status==='Completed'?'bg-green-100 text-green-700':t.status==='Pending'?'bg-amber-100 text-amber-700':'bg-blue-100 text-blue-700';
      var ts = t.pickupTime ? new Date(t.pickupTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '—';

  initChart: function() {
    var ctx = document.getElementById('dash-chart'); if(!ctx) return;

    var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], counts=[0,0,0,0,0,0,0], now=new Date();

    new Chart(ctx,{type:'line',data:{labels:days,datasets:[{label:'Trips',data:counts,borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.1)',fill:true,tension:.4}]},

  initDrop: function() {
    var dz=document.getElementById('drop-zone'), fi=document.getElementById('file-input');
    if(!dz||!fi) return;
    ['dragenter','dragover','dragleave','drop'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();e.stopPropagation();});});
    dz.addEventListener('drop',function(e){APP.handleFiles(e.dataTransfer.files);});
    fi.addEventListener('change',function(e){APP.handleFiles(e.target.files);});
  },

  handleFiles: function(files) {
    if(!files||!files.length) return;
    var el = document.getElementById('extract-results');
    el.innerHTML = '<div class="text-center py-12"><div class="spinner inline-block"></div><p class="text-slate-600 font-medium mt-4">AI is analyzing '+files.length+' document(s)...</p></div>';
    STATE.extracted = [];
    var idx = 0;
    function next() {
      if(idx>=files.length){APP.renderExtracted();return;}
      var file=files[idx++];
      APP.readFile(file,function(text){
        if(text) APP.callAI(text,file.name,function(){next();});
        else next();
      });
    }
    next();
  },

  readFile: function(file, cb) {
    if(file.name.endsWith('.csv')) {
      if(typeof Papa==='undefined'){cb('CSV parsing unavailable');return;}
      Papa.parse(file,{complete:function(r){cb(JSON.stringify(r.data));}});
    } else if(file.name.match(/\.(xlsx|xls)$/)) {
      if(typeof XLSX==='undefined'){cb('Excel parsing unavailable');return;}
      file.arrayBuffer().then(function(buf){var wb=XLSX.read(buf,{type:'array'});cb(wb.SheetNames.map(function(n){return JSON.stringify(XLSX.utils.sheet_to_json(wb.Sheets[n]));}).join('\n'));});
    } else if(file.name.endsWith('.pdf')) {
      if(typeof pdfjsLib==='undefined'){cb('PDF parsing unavailable');return;}
      file.arrayBuffer().then(function(buf){return pdfjsLib.getDocument(buf).promise;}).then(function(pdf){
        var ps=[]; for(var i=1;i<=Math.min(pdf.numPages,8);i++) ps.push(pdf.getPage(i).then(function(p){return p.getTextContent();}));
        Promise.all(ps).then(function(pages){cb(pages.map(function(p){return p.items.map(function(i){return i.str;}).join(' ');}).join('\n'));});
      });
    } else if(file.type.startsWith('image/')) {
      var r=new FileReader(); r.onload=function(e){cb(e.target.result);}; r.readAsDataURL(file);
    } else cb('');
  },

  callAI: function(content, filename, done) {
    var url = STATE.settings.workerUrl;
    var isDirect = false;
    if(!url){
      if(STATE.settings.apiKey){url='https://api.openai.com/v1/chat/completions';isDirect=true;}
      else{document.getElementById('extract-results').innerHTML='<div class="bg-amber-50 border border-amber-200 p-4 rounded-lg text-amber-800"><strong>API key required.</strong> Add your OpenAI API key in Settings.</div>';return;}
    }
    var prompt = 'You are a precise NEMT trip extractor. Extract ALL trips. Return ONLY a JSON array: [{"patientName":"","pickupAddress":"","dropoffAddress":"","pickupTime":"YYYY-MM-DDTHH:mm","phone":"","notes":""}]. No markdown.';
    var msgs = [{role:'system',content:prompt}];
    if(content.startsWith('data:image')) msgs.push({role:'user',content:[{type:'text',text:'Extract from '+filename},{type:'image_url',image_url:{url:content}}]});
    else msgs.push({role:'user',content:'Extract from '+filename+':\n\n'+content.substring(0,12000)});
    var hdrs = {'Content-Type':'application/json'};
    if(isDirect) hdrs['Authorization']='Bearer '+STATE.settings.apiKey;
    fetch(url,{method:'POST',headers:hdrs,body:JSON.stringify({model:STATE.settings.aiModel,messages:msgs,temperature:0})})
      .then(function(r){return r.json();})
      .then(function(data){
        if(data.error) throw new Error(data.error.message);
        var raw=data.choices[0].message.content;
        var m=raw.match(/\[[\s\S]*\]/);
        if(m){var trips=JSON.parse(m[0]);trips.forEach(function(t){t.driverId='';STATE.extracted.push(t);});}
        done();
      }).catch(function(e){
        document.getElementById('extract-results').innerHTML='<div class="text-red-700 bg-red-50 p-4 border border-red-200 rounded-lg"><strong>Error:</strong> '+e.message+'</div>';
      });
  },

  renderExtracted: function() {
    var el=document.getElementById('extract-results');
    if(!STATE.extracted.length){el.innerHTML='<div class="text-center text-slate-500 py-12">No trips found in documents.</div>';return;}
    var dOpts='<option value="">Unassigned</option>'+STATE.drivers.filter(function(d){return d.status==='active';}).map(function(d){return '<option value="'+d.id+'">'+d.name+'</option>';}).join('');
    el.innerHTML=STATE.extracted.map(function(t,i){
      return '<div class="bg-white p-4 rounded-lg mb-3 border border-slate-200 shadow-sm relative">'
        +'<button class="absolute top-2 right-2 text-slate-400 hover:text-red-500" onclick="APP.removeExtracted('+i+')"><i class="ph ph-x"></i></button>'
        +'<div class="flex justify-between items-start mb-3 pr-6">'
          +'<div><div class="font-bold text-slate-800">'+(t.patientName||'Unknown')+'</div><div class="text-xs text-slate-500">'+(t.pickupTime||'No Time')+'</div></div>'
          +'<select class="border rounded p-1 text-sm bg-white" onchange="APP.setExtractedDriver('+i+',this.value)">'+dOpts+'</select>'
        +'</div>'
        +'<div class="grid grid-cols-2 gap-2 bg-slate-50 border p-3 rounded">'
          +'<div><p class="text-xs font-bold text-slate-500 mb-1">PICKUP</p><p class="text-sm text-slate-700">'+(t.pickupAddress||'—')+'</p></div>'
          +'<div><p class="text-xs font-bold text-slate-500 mb-1">DROPOFF</p><p class="text-sm text-slate-700">'+(t.dropoffAddress||'—')+'</p></div>'
        +'</div>'
        +(t.notes?'<div class="text-xs text-blue-700 mt-2 bg-blue-50 p-2 rounded">'+t.notes+'</div>':'')
      +'</div>';
    }).join('');
  },

  setExtractedDriver: function(i,v){STATE.extracted[i].driverId=v;},
  bulkAssign: function(v){STATE.extracted.forEach(function(t){t.driverId=v;});APP.renderExtracted();},
  removeExtracted: function(i){STATE.extracted.splice(i,1);APP.renderExtracted();},

  saveExtracted: function() {
    if(!STATE.extracted.length) return;
    var list=STATE.extracted.slice(), i=0;
    function next(){
      if(i>=list.length){STATE.extracted=[];APP.renderExtracted();APP.toast('All trips saved!','success');return;}
      var t=list[i++];
      DB.saveTrip({id:uid(),patientName:t.patientName,pickupAddress:t.pickupAddress,dropoffAddress:t.dropoffAddress,pickupTime:t.pickupTime,notes:t.notes||'',phone:t.phone||'',status:'Pending',driverId:t.driverId||''},next);
    }
    next();
  },

  // ── SETTINGS ───────────────────────────────────────────────────────
  vSettings: function() {
    var s=STATE.settings;
    var fbSt=STATE.fbDb?'<span class="text-emerald-600 text-xs font-bold ml-2">✓ Connected</span>':'<span class="text-slate-400 text-xs ml-2">Not connected</span>';
    return '<div class="bg-white border rounded-xl p-6 shadow-sm max-w-2xl mb-20">'
      +'<h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2"><i class="ph ph-gear"></i> System Settings</h2>'
      +'<div class="space-y-6">'
        +'<div><h3 class="font-bold text-slate-700 mb-3">AI (for document extraction)</h3>'
          +'<div class="mb-4"><label class="block text-sm font-medium mb-1">OpenAI API Key</label><input type="password" id="set-api-key" class="w-full border p-3 rounded-lg" value="'+(s.apiKey||'')+'" placeholder="sk-..."><p class="text-xs text-slate-500 mt-1">Direct browser call to OpenAI.</p></div>'
          +'<div class="mb-4"><label class="block text-sm font-medium mb-1">Cloudflare Worker URL (secure proxy)</label><input type="url" id="set-url" class="w-full border p-3 rounded-lg" value="'+(s.workerUrl||'')+'" placeholder="https://your-worker.workers.dev"></div>'
          +'<div><label class="block text-sm font-medium mb-1">Model</label><select id="set-model" class="w-full border p-3 rounded-lg bg-white"><option value="gpt-4o-mini" '+(s.aiModel==='gpt-4o-mini'?'selected':'')+'>GPT-4o Mini (fast)</option><option value="gpt-4o" '+(s.aiModel==='gpt-4o'?'selected':'')+'>GPT-4o (best + vision)</option></select></div>'
        +'</div>'
        +'<div class="border-t pt-6"><h3 class="font-bold text-slate-700 mb-1 flex items-center"><i class="ph-fill ph-database text-blue-600 mr-2"></i>Cloud Firebase'+fbSt+'</h3>'
          +'<p class="text-xs text-slate-500 mb-3">Paste your Firebase config JSON to sync all data across devices in real time. Without it, everything saves permanently in <strong>this browser\'s IndexedDB</strong> — no data loss, works offline.</p>'
          +'<textarea id="set-firebase" rows="4" class="w-full border p-3 rounded-lg font-mono text-xs bg-slate-50" placeholder=\'{"apiKey":"...","authDomain":"...","projectId":"..."}\'>'+(s.firebaseConfig||'')+'</textarea>'
        +'</div>'
        +'<div class="border-t pt-6"><h3 class="font-bold text-slate-700 mb-3">Security</h3>'
          +'<label class="block text-sm font-medium mb-1">Admin PIN</label><input type="text" id="set-admin-pin" class="w-full border p-3 rounded-lg" value="'+(s.adminPin||'1234')+'"></div>'
        +'<button class="w-full py-4 bg-blue-600 text-white font-bold rounded-lg mt-4 shadow-md hover:bg-blue-700 transition" onclick="APP.saveSettings()">Save Settings</button>'
      +'</div></div>';
  },

  saveSettings: function() {
    var oldFb = STATE.settings.firebaseConfig;
    STATE.settings.apiKey         = document.getElementById('set-api-key').value;
    STATE.settings.workerUrl      = document.getElementById('set-url').value;
    STATE.settings.aiModel        = document.getElementById('set-model').value;
    STATE.settings.adminPin       = document.getElementById('set-admin-pin').value;
    STATE.settings.firebaseConfig = document.getElementById('set-firebase').value;
    DB.saveSettings(STATE.settings, function() { APP.toast('Settings saved ✓','success'); });
    if (oldFb !== STATE.settings.firebaseConfig) {
      APP.toast('Database config changed — reloading in 2s...','warning');
      setTimeout(function(){window.location.reload();},2000);
    } else { APP.switchView('settings'); }
  },

  // ── DRIVER WIZARD ──────────────────────────────────────────────────
  vWizard: function() {
    var mine = STATE.trips.filter(function(t){return t.driverId===STATE.user.id&&t.status!=='Completed';})
      .sort(function(a,b){return new Date(a.pickupTime)-new Date(b.pickupTime);});
    if(!mine.length) return '<div class="bg-white border rounded-xl p-10 text-center"><i class="ph-fill ph-check-circle text-emerald-500 text-6xl mb-4"></i><h2 class="text-2xl font-bold text-slate-800">All Caught Up!</h2><p class="text-slate-500 mt-2">No active assignments.</p></div>';

    var a=mine[0], q=mine.slice(1);
    var isPend=a.status==='Pending'||a.status==='Assigned';
    var isERP =a.status==='En Route to Pickup';
    var isAP  =a.status==='Arrived at Pickup';
    var isERD =a.status==='En Route to Dropoff';
    var ts = a.pickupTime?new Date(a.pickupTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—';

    function puCard() {
      var active=isERP?'bg-blue-50 border-blue-300':'bg-slate-50 border-slate-200';
      var btn='';
      if(isPend) btn='<button onclick="APP.setStatus(\''+a.id+'\',\'En Route to Pickup\')" class="w-full py-3 bg-slate-800 text-white font-bold rounded-lg flex items-center justify-center gap-2 hover:bg-slate-900 shadow-md"><i class="ph-fill ph-play"></i> Start Trip to Pickup</button>';
      if(isERP)  btn='<div class="flex gap-2"><button onclick="APP.nav(\''+a.pickupAddress+'\')" class="flex-1 py-3 bg-white border border-slate-300 text-slate-700 font-bold rounded-lg flex items-center justify-center gap-2 shadow-sm"><i class="ph-fill ph-navigation-arrow text-blue-600"></i> Map</button><button onclick="APP.promptPickup(\''+a.id+'\')" class="flex-1 py-3 bg-emerald-600 text-white font-bold rounded-lg flex items-center justify-center gap-2 hover:bg-emerald-700 shadow-md"><i class="ph-fill ph-check-circle"></i> Arrived</button></div>';
      return '<div class="p-4 rounded-xl border-2 transition-all '+active+'"><span class="text-xs text-slate-500 font-bold tracking-widest uppercase">1. Pickup</span><p class="text-slate-800 font-bold text-lg leading-tight my-3">'+(a.pickupAddress||'—')+'</p>'+btn+'</div>';
    }
    function doCard() {
      var active=isERD?'bg-blue-50 border-blue-300':'bg-slate-50 border-slate-200';
      var btn='';
      if(isAP) btn='<button onclick="APP.setStatus(\''+a.id+'\',\'En Route to Dropoff\')" class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg flex items-center justify-center gap-2 hover:bg-blue-700 shadow-md"><i class="ph-fill ph-play"></i> Begin Leg to Dropoff</button>';
      if(isERD) btn='<div class="flex gap-2"><button onclick="APP.nav(\''+a.dropoffAddress+'\')" class="flex-1 py-3 bg-white border border-slate-300 text-slate-700 font-bold rounded-lg flex items-center justify-center gap-2 shadow-sm"><i class="ph-fill ph-navigation-arrow text-blue-600"></i> Map</button><button onclick="APP.promptDropoff(\''+a.id+'\')" class="flex-1 py-3 bg-emerald-600 text-white font-bold rounded-lg flex items-center justify-center gap-2 hover:bg-emerald-700 shadow-md"><i class="ph-fill ph-flag-checkered"></i> Finish Trip</button></div>';
      return '<div class="p-4 rounded-xl border-2 transition-all '+active+'"><span class="text-xs text-slate-500 font-bold tracking-widest uppercase">2. Dropoff</span><p class="text-slate-800 font-bold text-lg leading-tight my-3">'+(a.dropoffAddress||'—')+'</p>'+btn+'</div>';
    }

    var queue = q.length?'<h4 class="mb-3 text-slate-500 uppercase font-bold text-xs tracking-wider mt-8">Up Next ('+q.length+')</h4><div class="grid gap-3">'
      +q.map(function(t){var ts2=t.pickupTime?new Date(t.pickupTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—';return '<div class="bg-white border p-4 rounded-xl shadow-sm flex justify-between items-center opacity-80"><div><h4 class="font-bold text-slate-800">'+t.patientName+'</h4><div class="text-xs text-slate-500 mt-1"><i class="ph-fill ph-clock"></i> '+ts2+' — '+(t.pickupAddress||'').substring(0,35)+'...</div></div></div>';}).join('')+'</div>':'';

    return '<h2 class="text-sm font-bold text-blue-600 uppercase tracking-wider mb-4">Active Trip</h2>'
      +'<div class="bg-white border-2 border-blue-400 p-5 rounded-xl shadow-md mb-8">'
        +'<div class="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>'
        +'<div class="flex justify-between items-start mb-4 border-b border-slate-100 pb-4">'
          +'<div><h3 class="font-bold text-xl text-slate-800">'+a.patientName+'</h3><span class="text-blue-600 text-sm font-medium"><i class="ph-fill ph-clock"></i> '+ts+'</span></div>'
          +'<span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1.5 rounded-full uppercase">'+a.status+'</span>'
        +'</div>'
        +'<div class="mb-4 flex gap-2">'
          +(a.phone?'<a href="tel:'+a.phone+'" class="flex-1 flex items-center justify-center gap-2 bg-emerald-50 text-emerald-700 py-3 rounded-lg border border-emerald-200 font-bold"><i class="ph-fill ph-phone"></i> Call</a>'
            +'<a href="sms:'+a.phone+'" class="flex-1 flex items-center justify-center gap-2 bg-blue-50 text-blue-700 py-3 rounded-lg border border-blue-200 font-bold"><i class="ph-fill ph-chat-circle-text"></i> SMS</a>'
          :'<button class="w-full py-3 bg-slate-100 text-slate-400 rounded-lg font-bold" disabled>No Phone</button>')
        +'</div>'
        +(a.notes?'<div class="flex items-start gap-2 bg-amber-50 text-amber-800 p-3 rounded-lg border border-amber-200 text-sm mb-4"><i class="ph-fill ph-warning shrink-0 mt-0.5"></i><p><strong>Notes:</strong> '+a.notes+'</p></div>':'')
        +'<div class="space-y-4">'+puCard()+doCard()+'</div>'
      +'</div>'
      +queue;
  },

  nav: function(addr) { window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr),'_blank'); },

  setStatus: function(id, status) {
    var t=STATE.trips.find(function(x){return x.id===id;});
    if(!t) return;
    t.status=status;
    DB.saveTrip(t,function(){APP.refreshView();});
  },

  promptPickup: function(id) {
    STATE.wizCb=function(){APP.setStatus(id,'Arrived at Pickup');};
    document.getElementById('wizard-prompt-title').innerText='Arrived at Pickup';
    document.getElementById('wizard-sig-wrap').classList.remove('hidden');
    document.getElementById('wizard-odo').value='';
    document.getElementById('wizard-time').value=new Date().toTimeString().slice(0,5);
    document.getElementById('wizard-sig-check').checked=false;
    APP.openModal('modal-wizard-prompt');
  },

  promptDropoff: function(id) {
    STATE.wizCb=function(){APP.setStatus(id,'Completed');};
    document.getElementById('wizard-prompt-title').innerText='Trip Completed';
    document.getElementById('wizard-sig-wrap').classList.add('hidden');
    document.getElementById('wizard-odo').value='';
    document.getElementById('wizard-time').value=new Date().toTimeString().slice(0,5);
    APP.openModal('modal-wizard-prompt');
  },

  confirmWizardPrompt: function() {
    var odo=document.getElementById('wizard-odo').value;
    var time=document.getElementById('wizard-time').value;
    var sigWrap=document.getElementById('wizard-sig-wrap');
    var sigOk=document.getElementById('wizard-sig-check').checked;
    if(!odo||!time) return APP.toast('Please fill in odometer and time.','danger');
    if(!sigWrap.classList.contains('hidden')&&!sigOk) return APP.toast('Please verify the paper signature.','danger');
    APP.closeModal('modal-wizard-prompt');
    if(STATE.wizCb){STATE.wizCb();STATE.wizCb=null;}
  }
};

window.APP = APP;

// ═══════════════════════════════════════════════════════════════════════
// START — runs when HTML is fully parsed (script is at bottom of body)
// ═══════════════════════════════════════════════════════════════════════
APP.init();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
