<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Agape Care NEMT Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input,select,textarea,button{font-family:inherit;font-size:16px;outline:none}
    html,body{font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(1rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left))}
    .modal-backdrop.open{opacity:1;pointer-events:auto}
    .modal-panel{transform:scale(.95);transition:transform .2s cubic-bezier(.16,1,.3,1);max-height:96vh;display:flex;flex-direction:column}
    .modal-backdrop.open .modal-panel{transform:scale(1)}
    .modal-body{overflow-y:auto}
    .toast-container{position:fixed;bottom:max(2rem,env(safe-area-inset-bottom));right:2rem;display:flex;flex-direction:column;gap:.5rem;z-index:200}
    @media(max-width:600px){.toast-container{left:1rem;right:1rem;bottom:max(1rem,env(safe-area-inset-bottom))}}
    .toast{padding:1rem 1.25rem;border-radius:.5rem;background:#1e293b;color:#fff;box-shadow:0 10px 15px -3px rgba(0,0,0,.1);border-left:4px solid #3b82f6;display:flex;align-items:center;gap:.75rem;transform:translateX(120%);transition:transform .3s cubic-bezier(.16,1,.3,1)}
    .toast.show{transform:translateX(0)}
    .toast.success{border-left-color:#10b981}
    .toast.danger{border-left-color:#ef4444}
    .toast.warning{border-left-color:#f59e0b}
    #loading-screen{position:fixed;inset:0;background:#f8fafc;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .spinner{width:48px;height:48px;border:4px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media print{.no-print,header,.tabs-bar{display:none!important}}
    .key-visible { -webkit-text-security: none !important; }
  </style>
</head>

<!-- CDN scripts at bottom so they don't block rendering -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════════════
// BOOT — always show auth immediately, never block on Firebase
// ═══════════════════════════════════════════════════════════════════════
var BOOT_DONE = false;
function showAuth() {
  if (BOOT_DONE) return;
  BOOT_DONE = true;
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = '';
  // Populate select after a tick so APP is guaranteed to exist
  setTimeout(function() {
    if (window.APP && APP.populateAuthSelect) APP.populateAuthSelect();
  }, 0);
}
// Hard deadline — show auth after 3s no matter what
var BOOT_TIMER = setTimeout(showAuth, 3000);

// ═══════════════════════════════════════════════════════════════════════
// INDEXEDDB
// ═══════════════════════════════════════════════════════════════════════
var IDB = {
  db: null,
  open: function(cb) {
    try {
      var req = indexedDB.open('AgapeNEMT', 2);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('trips'))   db.createObjectStore('trips',   {keyPath:'id'});
        if (!db.objectStoreNames.contains('drivers')) db.createObjectStore('drivers', {keyPath:'id'});
        if (!db.objectStoreNames.contains('kv'))      db.createObjectStore('kv',       {keyPath:'k'});
      };
      req.onsuccess = function(e) { IDB.db = e.target.result; cb(null); };
      req.onerror   = function(e) { cb(e); };
    } catch(e) { cb(e); }
  },
  getAll: function(store, cb) {
    if (!IDB.db) return cb([]);
    try {
      var req = IDB.db.transaction(store,'readonly').objectStore(store).getAll();
      req.onsuccess = function() { cb(req.result || []); };
      req.onerror   = function() { cb([]); };
    } catch(e) { cb([]); }
  },
  put: function(store, obj, cb) {
    cb = cb || function(){};
    if (!IDB.db) return cb();
    try {
      var req = IDB.db.transaction(store,'readwrite').objectStore(store).put(obj);
      req.onsuccess = cb;
      req.onerror   = cb;
    } catch(e) { cb(); }
  },
  del: function(store, id, cb) {
    cb = cb || function(){};
    if (!IDB.db) return cb();
    try {
      var req = IDB.db.transaction(store,'readwrite').objectStore(store).delete(id);
      req.onsuccess = cb;
      req.onerror   = cb;
    } catch(e) { cb(); }
  },
  getKV: function(k, def, cb) {
    if (!IDB.db) return cb(def);
    try {
      var req = IDB.db.transaction('kv','readonly').objectStore('kv').get(k);
      req.onsuccess = function() { cb(req.result ? req.result.v : def); };
      req.onerror   = function() { cb(def); };
    } catch(e) { cb(def); }
  },
  putKV: function(k, v, cb) {
    IDB.put('kv', {k:k, v:v}, cb);
  }
};

// ═══════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════
var STATE = {
  user:     null,
  trips:    [],
  drivers:  [{id:'d1', name:'John Doe', pin:'1111', phone:'555-0101', status:'active'}],
  settings: {workerUrl:'', apiKey:'', aiModel:'gpt-4o-mini', adminPin:'1234', mapApp:'google', firebaseConfig:''},
  view:     'dashboard',
  extracted:[],
  mapInst:  null,
  wizCb:    null,
  fbDb:     null,
  fbUnsubs: []
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ═══════════════════════════════════════════════════════════════════════
// DB LAYER
// ═══════════════════════════════════════════════════════════════════════
var DB = {
  saveTrip: function(trip, cb) {
    cb = cb || function(){};
    IDB.put('trips', trip, function() {
      var idx = STATE.trips.findIndex(function(t){return t.id===trip.id;});
      if (idx>-1) STATE.trips[idx]=trip; else STATE.trips.push(trip);
      if (STATE.fbDb) {
        var d = Object.assign({},trip); var id=d.id; delete d.id;
        STATE.fbDb.collection('nemt_trips').doc(id).set(d).catch(function(e){console.warn('FB trip:',e);});
      }
      cb();
    });
  },
  deleteTrip: function(id, cb) {
    cb = cb || function(){};
    IDB.del('trips', id, function() {
      STATE.trips = STATE.trips.filter(function(t){return t.id!==id;});
      if (STATE.fbDb) STATE.fbDb.collection('nemt_trips').doc(id).delete().catch(function(){});
      cb();
    });
  },
  saveDriver: function(driver, cb) {
    cb = cb || function(){};
    IDB.put('drivers', driver, function() {
      var idx = STATE.drivers.findIndex(function(d){return d.id===driver.id;});
      if (idx>-1) STATE.drivers[idx]=driver; else STATE.drivers.push(driver);
      if (STATE.fbDb) {
        var d = Object.assign({},driver); var id=d.id; delete d.id;
        STATE.fbDb.collection('nemt_drivers').doc(id).set(d).catch(function(){});
      }
      cb();
    });
  },
  saveSettings: function(s, cb) {
    cb = cb || function(){};
    IDB.putKV('settings', s, cb);
    // FIX: Also sync settings to Firebase so other devices can retrieve them
    if (STATE.fbDb) {
      // Store a sanitized copy (no apiKey for security) for cross-device sync
      var syncable = Object.assign({}, s);
      delete syncable.apiKey; // Never sync API key to cloud
      STATE.fbDb.collection('nemt_config').doc('settings').set(syncable).catch(function(e){
        console.warn('Firebase settings sync failed:', e);
      });
    }
  }
};

// ═══════════════════════════════════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════════════════════════════════
function initFirebase(configJson, onConnected) {
  if (!configJson || !configJson.trim()) return;

  function loadScript(src, cb) {
    // Check if already loaded
    var existing = document.querySelector('script[src="'+src+'"]');
    if (existing) { cb(); return; }
    var s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = function() {
      console.warn('Firebase script failed to load:', src);
      APP.toast('Firebase SDK failed to load. Check your internet.','danger');
    };
    document.head.appendChild(s);
  }

  loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js', function() {
    loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js', function() {
      try {
        var config = JSON.parse(configJson);

        if (typeof firebase === 'undefined') {
          APP.toast('Firebase SDK unavailable.','danger');
          return;
        }

        var app;
        try {
          app = firebase.app();
          // App exists — check if it's configured for the same project
          console.log('Reusing existing Firebase app.');
        } catch(e) {
          app = firebase.initializeApp(config);
        }

        STATE.fbDb = firebase.firestore(app);

        // Detach old listeners
        STATE.fbUnsubs.forEach(function(u){ try{u();}catch(e){} });
        STATE.fbUnsubs = [];

        // FIX: First pull remote settings so new devices get workerUrl etc.
        STATE.fbDb.collection('nemt_config').doc('settings').get().then(function(doc) {
          if (doc.exists) {
            var remote = doc.data();
            // Merge remote settings, but keep local apiKey (never synced to cloud)
            var localApiKey = STATE.settings.apiKey;
            STATE.settings = Object.assign(STATE.settings, remote);
            STATE.settings.apiKey = localApiKey; // preserve local apiKey
            STATE.settings.firebaseConfig = configJson; // preserve the config
            // Save merged settings back to local IDB
            IDB.putKV('settings', STATE.settings, function(){});
            console.log('Remote settings loaded from Firebase');
          }
          if (onConnected) onConnected();
        }).catch(function(e){
          console.warn('Could not fetch remote settings:', e);
          if (onConnected) onConnected();
        });

        // Live trips listener
        STATE.fbUnsubs.push(
          STATE.fbDb.collection('nemt_trips').onSnapshot(function(snap) {
            STATE.trips = [];
            snap.forEach(function(d){ STATE.trips.push(Object.assign({id:d.id}, d.data())); });
            // Cache locally
            STATE.trips.forEach(function(t){ IDB.put('trips', t); });
            APP.refreshView();
          }, function(e){
            console.warn('FB trips listener error:',e);
            APP.toast('Firebase trips error: '+e.message,'danger');
          })
        );

        // Live drivers listener
        STATE.fbUnsubs.push(
          STATE.fbDb.collection('nemt_drivers').onSnapshot(function(snap) {
            if (!snap.empty) {
              STATE.drivers = [];
              snap.forEach(function(d){ STATE.drivers.push(Object.assign({id:d.id}, d.data())); });
              STATE.drivers.forEach(function(d){ IDB.put('drivers', d); });
              if (STATE.view==='drivers') APP.refreshView();
            }
          }, function(e){ console.warn('FB drivers listener error:',e); })
        );

        document.getElementById('db-badge').classList.remove('hidden');
        APP.toast('🔥 Firebase connected — cloud sync active','success');

      } catch(e) {
        console.error('Firebase init error:', e);
        if (e.message && e.message.includes('JSON')) {
          APP.toast('Firebase config is not valid JSON. Check Settings.','danger');
        } else {
          APP.toast('Firebase error: '+e.message,'danger');
        }
      }
    });
  });
}

// ═══════════════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════════════
var APP = {

  init: function() {
    document.getElementById('loading-msg').textContent = 'Opening local database...';
    IDB.open(function(err) {
      if (err) { console.warn('IDB failed, running in memory mode:', err); APP.afterLoad(); return; }
      document.getElementById('loading-msg').textContent = 'Loading your data...';
      IDB.getAll('trips', function(trips) {
        if (trips.length) STATE.trips = trips;
        IDB.getAll('drivers', function(drivers) {
          if (drivers.length) STATE.drivers = drivers;
          else IDB.put('drivers', STATE.drivers[0]);
          IDB.getKV('settings', null, function(saved) {
            if (saved) STATE.settings = Object.assign(STATE.settings, saved);
            APP.afterLoad();
          });
        });
      });
    });
  },

  afterLoad: function() {
    clearTimeout(BOOT_TIMER);
    if (STATE.settings.firebaseConfig && STATE.settings.firebaseConfig.trim()) {
      // FIX: Show loading while Firebase connects so we get remote settings first
      document.getElementById('loading-msg').textContent = 'Connecting to cloud...';
      initFirebase(STATE.settings.firebaseConfig, function() {
        showAuth();
      });
      // Safety fallback — show auth after 5s regardless
      setTimeout(showAuth, 5000);
    } else {
      showAuth();
    }
  },

  populateAuthSelect: function() {
    var sel = document.getElementById('auth-driver-select');
    if (!sel) return;
    sel.innerHTML = '<option value="">Select your profile...</option>' +
      STATE.drivers.filter(function(d){return d.status==='active';})
        .map(function(d){return '<option value="'+d.id+'">'+d.name+'</option>';}).join('');
  },

  loginAdmin: function() {
    var pin = document.getElementById('auth-admin-pin').value;
    if (pin === (STATE.settings.adminPin||'1234')) {
      STATE.user = {role:'admin', id:'admin', name:'Administrator'};
      APP.enterApp();
    } else APP.toast('Invalid Admin PIN','danger');
  },

  loginDriver: function() {
    var sel = document.getElementById('auth-driver-select').value;
    var pin = document.getElementById('auth-driver-pin').value;
    if (!sel) return APP.toast('Select a driver profile','warning');
    var driver = STATE.drivers.find(function(d){return d.id===sel;});
    if (driver && driver.pin===pin) {
      STATE.user = {role:'driver', id:driver.id, name:driver.name};
      APP.enterApp();
    } else APP.toast('Invalid Driver PIN','danger');
  },

  logout: function() {
    STATE.user = null;
    document.getElementById('app-main').style.display='none';
    document.getElementById('auth-screen').style.display='';
    document.getElementById('auth-admin-pin').value='';
    document.getElementById('auth-driver-pin').value='';
    APP.populateAuthSelect();
    APP.toast('Logged out','success');
  },

  enterApp: function() {
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app-main').style.display='';
    document.getElementById('header-title').innerText = STATE.user.role==='admin' ? 'Admin Dashboard' : 'Driver: '+STATE.user.name;
    document.getElementById('driver-status-bar').style.display = STATE.user.role==='driver' ? '' : 'none';
    APP.toast('Welcome back, '+STATE.user.name,'success');
    APP.switchView(STATE.user.role==='admin' ? 'dashboard' : 'driver-wizard');
  },

  toast: function(msg, type) {
    type = type||'primary';
    var c = document.getElementById('toast-container');
    var el = document.createElement('div');
    el.className = 'toast '+type;
    var icons = {success:'check-circle', danger:'warning-circle', warning:'warning', primary:'info'};
    el.innerHTML = '<i class="ph-fill ph-'+(icons[type]||'info')+' text-xl"></i><span>'+msg+'</span>';
    c.appendChild(el);
    setTimeout(function(){el.classList.add('show');},10);
    setTimeout(function(){el.classList.remove('show');setTimeout(function(){el.remove();},300);},4500);
  },

  openModal:  function(id){document.getElementById(id).classList.add('open');},
  closeModal: function(id){document.getElementById(id).classList.remove('open');},

  // ── TABS & ROUTING ─────────────────────────────────────────────────
  renderTabs: function() {
    var tabs = STATE.user.role==='admin' ? [
      {id:'dashboard',    icon:'chart-pie-slice', label:'Dashboard'},
      {id:'dispatch',     icon:'radar',           label:'Live Fleet'},
      {id:'trips',        icon:'clipboard-text',  label:'Tasks'},
      {id:'extract',      icon:'magic-wand',      label:'AI Extract'},
      {id:'drivers',      icon:'users',           label:'Drivers'},
      {id:'settings',     icon:'gear',            label:'Settings'}
    ] : [
      {id:'driver-wizard',icon:'clipboard-text',  label:'My Route'},
      {id:'settings',     icon:'gear',            label:'Settings'}
    ];
    document.getElementById('tabs-container').innerHTML = tabs.map(function(t) {
      var a = STATE.view===t.id;
      return '<button onclick="APP.switchView(\''+t.id+'\')" class="flex-1 py-2 px-3 font-medium rounded-lg flex items-center justify-center gap-1.5 whitespace-nowrap transition '+(a?'bg-blue-100 text-blue-700':'text-slate-600 hover:bg-slate-100')+'">'
        +'<i class="ph ph-'+t.icon+' text-lg"></i>'+t.label+'</button>';
    }).join('');
  },

  switchView: function(v) {
    STATE.view = v;
    APP.renderTabs();
    APP.refreshView();
  },

  refreshView: function() {
    var c = document.getElementById('views-container');
    if (!c) return;
    var html = '';
    switch(STATE.view) {
      case 'dashboard':    html = APP.vDashboard(); break;
      case 'trips':        html = APP.vTrips(); break;
      case 'dispatch':     html = APP.vDispatch(); break;
      case 'extract':      html = APP.vExtract(); break;
      case 'settings':     html = APP.vSettings(); break;
      case 'drivers':      html = APP.vDrivers(); break;
      case 'driver-wizard':html = APP.vWizard(); break;
      default: html = '<div class="bg-white p-6 rounded-xl border text-slate-500">View not found.</div>';
    }
    c.innerHTML = html;
    if (STATE.view==='dashboard') APP.initChart();
    if (STATE.view==='dispatch')  APP.initMap();
    if (STATE.view==='extract')   APP.initDrop();
  },

  // ── DASHBOARD ──────────────────────────────────────────────────────
  vDashboard: function() {
    var today = new Date().toISOString().split('T')[0];
    var tt = STATE.trips.filter(function(t){return t.pickupTime&&t.pickupTime.startsWith(today);});
    var comp = tt.filter(function(t){return t.status==='Completed';}).length;
    var activeD = STATE.drivers.filter(function(d){return d.status==='active';}).length;
    function card(label,val,cls) {
      return '<div class="bg-white border rounded-xl p-5 shadow-sm"><div class="text-xs text-slate-500 uppercase font-bold tracking-wide">'+label+'</div><div class="text-3xl font-bold '+cls+' mt-2">'+val+'</div></div>';
    }
    var rows = tt.slice(0,6).map(function(t) {
      var cls = t.status==='Completed'?'bg-green-100 text-green-700':t.status==='Pending'?'bg-amber-100 text-amber-700':'bg-blue-100 text-blue-700';
      var ts = t.pickupTime ? new Date(t.pickupTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '—';
      return '<div class="flex justify-between items-center pb-3 border-b last:border-0 last:pb-0">'
        +'<div><div class="font-bold text-slate-800 text-sm">'+t.patientName+'</div><div class="text-xs text-slate-500">'+ts+'</div></div>'
        +'<span class="px-2 py-1 rounded text-[10px] font-bold uppercase '+cls+'">'+t.status+'</span></div>';
    }).join('') || '<p class="text-sm text-slate-500 text-center py-4">No trips today yet.</p>';

    return '<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">'
      +card('Today\'s Trips',tt.length,'text-slate-800')
      +card('Completed',comp,'text-emerald-600')
      +card('Active Drivers',activeD,'text-blue-600')
      +card('Total Logged',STATE.trips.length,'text-amber-500')
      +'</div>'
      +'<div class="grid grid-cols-1 md:grid-cols-3 gap-6">'
        +'<div class="bg-white border rounded-xl p-5 shadow-sm md:col-span-2"><h3 class="font-bold text-lg text-slate-800 mb-4">Weekly Volume</h3><div style="height:300px;position:relative"><canvas id="dash-chart"></canvas></div></div>'
        +'<div class="bg-white border rounded-xl p-5 shadow-sm"><h3 class="font-bold text-lg text-slate-800 mb-4">Today\'s Activity</h3><div class="space-y-3">'+rows+'</div></div>'
      +'</div>';
  },

  initChart: function() {
    var ctx = document.getElementById('dash-chart'); if(!ctx) return;
    if (typeof Chart==='undefined') return;
    var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], counts=[0,0,0,0,0,0,0], now=new Date();
    STATE.trips.forEach(function(t){
      if(!t.pickupTime) return;
      var d=new Date(t.pickupTime), diff=Math.floor((now-d)/86400000);
      if(diff>=0&&diff<7) counts[d.getDay()]++;
    });
    new Chart(ctx,{type:'line',data:{labels:days,datasets:[{label:'Trips',data:counts,borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.1)',fill:true,tension:.4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}}});
  },

            +'</div></div></div>'
        +'<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-2">'
          +'<div class="bg-slate-50 p-3 rounded-lg border"><span class="text-xs text-slate-500 font-bold block mb-1">PICKUP ('+ts+')</span><p class="text-sm font-medium text-slate-800">'+(t.pickupAddress||'—')+'</p></div>'

      +'</div>';

            +'<button class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium whitespace-nowrap" onclick="APP.saveExtracted()"><i class="ph ph-check-square"></i> Save All</button>'
          +'</div></div>'
        +'<div id="extract-results" class="flex-1 overflow-y-auto bg-slate-50 rounded-lg p-4 border" style="min-height:300px">'

  initDrop: function() {
    var dz = document.getElementById('drop-zone');
    var fi = document.getElementById('file-input');
    if (!dz || !fi) return;

    ['dragenter','dragover','dragleave','drop'].forEach(function(ev){
      dz.addEventListener(ev, function(e){ e.preventDefault(); e.stopPropagation(); });
    });

    dz.addEventListener('dragover', function(){ dz.classList.add('bg-blue-100'); });
    dz.addEventListener('dragleave', function(){ dz.classList.remove('bg-blue-100'); });

    dz.addEventListener('drop', function(e) {
      dz.classList.remove('bg-blue-100');
      APP.handleFiles(e.dataTransfer.files);
    });

    fi.addEventListener('change', function(e) {
      if (!e.target.files || !e.target.files.length) return;
      // FIX: Copy files to array BEFORE resetting input (resetting clears the FileList)
      var filesCopy = Array.from(e.target.files);
      fi.value = '';
      APP.handleFiles(filesCopy);
    });
  },

  handleFiles: function(files) {
    if (!files || !files.length) return;

    // FIX: Check for API config before doing anything
    if (!STATE.settings.apiKey && !STATE.settings.workerUrl) {
      document.getElementById('extract-results').innerHTML =
        '<div class="bg-amber-50 border border-amber-200 p-5 rounded-lg text-amber-800">'
        +'<div class="font-bold text-base mb-2">⚠ API Key Required</div>'
        +'<p class="text-sm">Go to <strong>Settings</strong> and enter your OpenAI API key (starts with <code>sk-</code>) or a Cloudflare Worker URL before uploading files.</p>'
        +'</div>';
      return;
    }

    var el = document.getElementById('extract-results');
    var statusEl = document.getElementById('file-processing-status');
    el.innerHTML = '<div class="text-center py-12"><div class="spinner" style="display:inline-block"></div><p class="text-slate-600 font-medium mt-4">AI is analyzing '+files.length+' document(s)...</p></div>';
    if (statusEl) { statusEl.classList.remove('hidden'); statusEl.innerHTML = '<p class="text-xs text-blue-600">Reading files...</p>'; }
    STATE.extracted = [];
    var arr = Array.from(files);
    var idx = 0;
    function next() {
      if (idx >= arr.length) { 
        if (statusEl) statusEl.classList.add('hidden');
        APP.renderExtracted(); 
        return; 
      }
      var file = arr[idx++];
      if (statusEl) statusEl.innerHTML = '<p class="text-xs text-blue-600">Processing: '+file.name+'</p>';
      APP.readFile(file, function(text, err) {
        if (err) {
          APP.toast('Failed to read: '+file.name+' — '+err, 'danger');
          next(); return;
        }
        if (text) APP.callAI(text, file.name, function(){ next(); });
        else { APP.toast('Could not extract text from: '+file.name,'warning'); next(); }
      });
    }
    next();
  },

  // FIX: readFile now passes errors to callback; waits for PDF.js to load
  readFile: function(file, cb) {
    var name = file.name.toLowerCase();

    // ── CSV ──────────────────────────────────────────────────────────
    if (name.endsWith('.csv')) {
      if (typeof Papa === 'undefined') {
        // Papa not loaded yet, try reading as text
        var r = new FileReader();
        r.onload = function(e){ cb(e.target.result); };
        r.onerror = function(){ cb('', 'FileReader error'); };
        r.readAsText(file);
        return;
      }
      Papa.parse(file, {
        complete: function(r) { cb(JSON.stringify(r.data)); },
        error: function(e) { cb('', 'CSV parse error: '+e); }
      });

    // ── Excel ────────────────────────────────────────────────────────
    } else if (name.match(/\.(xlsx|xls)$/)) {
      if (typeof XLSX === 'undefined') {
        cb('', 'Excel library not loaded yet. Please wait a moment and try again.');
        return;
      }
      file.arrayBuffer().then(function(buf) {
        try {
          var wb = XLSX.read(new Uint8Array(buf), {type:'array'});
          cb(wb.SheetNames.map(function(n){
            return JSON.stringify(XLSX.utils.sheet_to_json(wb.Sheets[n]));
          }).join('\n'));
        } catch(e) {
          cb('', 'Excel parse error: '+e.message);
        }
      }).catch(function(e) {
        cb('', 'Cannot read Excel file: '+e.message);
      });

    // ── PDF ─────────────────────────────────────────────────────────
    } else if (name.endsWith('.pdf')) {
      // FIX: If PDF.js not loaded yet, wait up to 5 seconds for it
      var pdfAttempts = 0;
      function tryPdf() {
        if (typeof pdfjsLib === 'undefined') {
          pdfAttempts++;
          if (pdfAttempts > 10) { cb('', 'PDF library failed to load. Check your internet connection.'); return; }
          setTimeout(tryPdf, 500);
          return;
        }

        // Ensure worker is always set
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        file.arrayBuffer().then(function(buf) {
          return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
        }).then(function(pdf) {
          var pagePromises = [];
          for (var i = 1; i <= Math.min(pdf.numPages, 8); i++) {
            pagePromises.push(pdf.getPage(i).then(function(p){ return p.getTextContent(); }));
          }
          return Promise.all(pagePromises);
        }).then(function(pages) {
          var text = pages.map(function(p){
            return p.items.map(function(item){ return item.str; }).join(' ');
          }).join('\n');
          if (!text.trim()) {
            APP.toast('PDF appears to be a scanned image. Try GPT-4o (vision) in Settings.','warning');
            cb('');
          } else {
            cb(text);
          }
        }).catch(function(e) {
          cb('', 'PDF error: '+(e.message||'Unknown error'));
        });
      }
      tryPdf();

    // ── Image ────────────────────────────────────────────────────────
    } else if (file.type.startsWith('image/')) {
      var r = new FileReader();
      r.onload = function(e) { cb(e.target.result); };
      r.onerror = function(e) { cb('', 'Image read error'); };
      r.readAsDataURL(file);

    } else {
      cb('', 'Unsupported file type: '+name.split('.').pop());
    }
  },

  callAI: function(content, filename, done) {
    var url = STATE.settings.workerUrl;
    var isDirect = false;
    if (!url) {
      if (STATE.settings.apiKey) {
        url = 'https://api.openai.com/v1/chat/completions';
        isDirect = true;
      } else {
        document.getElementById('extract-results').innerHTML =
          '<div class="bg-amber-50 border border-amber-200 p-4 rounded-lg text-amber-800"><strong>API key required.</strong> Add your OpenAI API key in Settings.</div>';
        return;
      }
    }
    var prompt = 'You are a precise NEMT trip extractor. Extract ALL trips. Return ONLY a JSON array: [{"patientName":"","pickupAddress":"","dropoffAddress":"","pickupTime":"YYYY-MM-DDTHH:mm","phone":"","notes":""}]. No markdown.';
    var msgs = [{role:'system', content:prompt}];
    if (content.startsWith('data:image')) {
      msgs.push({role:'user', content:[
        {type:'text', text:'Extract all NEMT trips from this document: '+filename},
        {type:'image_url', image_url:{url:content}}
      ]});
    } else {
      msgs.push({role:'user', content:'Extract all NEMT trips from '+filename+':\n\n'+content.substring(0,12000)});
    }
    var hdrs = {'Content-Type':'application/json'};
    if (isDirect) hdrs['Authorization'] = 'Bearer '+STATE.settings.apiKey;

    fetch(url, {
      method:'POST',
      headers: hdrs,
      body: JSON.stringify({model: STATE.settings.aiModel, messages: msgs, temperature:0})
    })
    .then(function(r){
      if (!r.ok) {
        return r.text().then(function(t){
          throw new Error('HTTP '+r.status+': '+(t||r.statusText));
        });
      }
      return r.json();
    })
    .then(function(data) {
      if (data.error) throw new Error(data.error.message);
      var raw = data.choices[0].message.content;
      var m = raw.match(/\[[\s\S]*\]/);
      if (m) {
        try {
          var trips = JSON.parse(m[0]);
          trips.forEach(function(t){ t.driverId=''; STATE.extracted.push(t); });
        } catch(e) {
          APP.toast('AI returned invalid JSON for '+filename,'warning');
        }
      }
      done();
    })
    .catch(function(e) {
      console.error('AI call error:', e);
      document.getElementById('extract-results').innerHTML =
        '<div class="text-red-700 bg-red-50 p-4 border border-red-200 rounded-lg"><strong>AI Error:</strong> '+e.message+'<br><small class="text-red-500">Check your API key and internet connection.</small></div>';
    });
  },

if (!sigWrap.classList.contains(‘hidden’)&&!sigOk) return APP.toast(‘Please verify the paper signature.’,‘danger’);
APP.closeModal(‘modal-wizard-prompt’);
if (STATE.wizCb){ STATE.wizCb(); STATE.wizCb=null; }
}
};
