<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/agape.png" />
    <link rel="apple-touch-icon" href="/agape.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/agape.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/agape.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/agape.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agape Care" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1E3A8A" />
    <meta name="description" content="Agape Care - Professional Fleet Management System for Enterprise" />
    <meta name="keywords" content="fleet management, dispatch system, vehicle tracking, logistics, NEMT" />
    <meta name="author" content="Agape Care" />
    <!-- Preconnect: save 100-300ms on Firebase/Google API DNS+TLS -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <!-- Surface stale chunk/TDZ errors without forcing a reload during active work. -->
    <script>
      var agapeCacheError = /ChunkLoadError|Loading chunk|dynamically imported|Failed to fetch dynamically|Cannot access.*before initialization/;
      window.addEventListener('error', function agapeOnError(e) {
        if (e.target && e.target.tagName === 'LINK') return;
        if (e.message && agapeCacheError.test(e.message)) {
          console.warn('[Agape] Stale cache detected (' + e.message + '), waiting for manual refresh.');
          try { sessionStorage.setItem('agape_refresh_needed', 'stale_cache'); } catch (_) {}
          window.dispatchEvent(new CustomEvent('agapeRefreshNeeded', {
            detail: {
              reason: 'stale_cache',
              message: 'A fresh app version is available. Refresh when you are ready.'
            }
          }));
        }
      });
    </script>
    <title>Agape Care - Fleet Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
